[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql"
version = "0.1.0"
description = "PF(EAV) 상품 DB용 Text-to-SQL PoC: LLM은 의도만 추출하고 SQL은 검증된 템플릿으로 조립한다"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

# 메타데이터 JSON을 패키지에 포함한다 (챗봇이 GitHub에서 설치해도 파일이 같이 들어가도록)
[tool.setuptools.package-data]
text_to_sql = ["metadata/*.json", "metadata/sites/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
